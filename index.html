<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubibet Pro Analyzer - AI Core</title>
    <style>
        :root {
            --bg-color: #08000f;
            --neon-primary: #a200ff;
            --neon-secondary: #ff00ea;
            --timer-color: #ffd700; /* لون العداد الأصفر المضيء */
            --text-glow: 0 0 10px rgba(162, 0, 255, 0.5);
            --danger-color: #ff3366;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Consolas', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding-bottom: 120px; /* مساحة للعداد بالأسفل */
        }

        /* إصلاح تأثير الخطوط المتحركة في الخلفية لتظهر بوضوح */
        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(162, 0, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(162, 0, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -2;
        }

        .scanning-lines {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(162, 0, 255, 0.3), transparent);
            animation: scan 3s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -100%; }
            100% { top: 100%; }
        }

        /* حاوية الأداة المركزية */
        .main-container {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            padding: 20px;
            box-sizing: border-box;
            background: transparent;
            z-index: 10;
        }

        h2 {
            text-align: center;
            color: var(--neon-primary);
            text-shadow: var(--text-glow);
            margin-top: 0;
            font-size: 1.5em;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(58, 13, 89, 0.5);
            padding-bottom: 15px;
            text-transform: uppercase;
        }

        /* لوحة الروليت (تم إزالة البطاقة والإطارات) */
        .board-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 25px;
            border: none;
            box-shadow: none;
            background: transparent;
        }

        .board-wrapper img {
            width: 100%;
            display: block;
            border-radius: 5px; /* حواف ناعمة للصورة فقط إذا لزم الأمر */
        }

        /* 
           تعديل موقع الشبكة لتطابق الأرقام. 
           إذا كانت العلامات غير مضبوطة تماماً على صورتك، 
           قم بتغيير النسب المئوية (top, left, width, height) قليلاً.
        */
        .grid-overlay {
            position: absolute;
            top: 15.5%; 
            left: 5%;
            width: 90%;
            height: 38%;
            display: grid;
            grid-template-columns: 1.15fr repeat(12, 1fr); /* تم ضبط الأعمدة */
            grid-template-rows: repeat(3, 1fr);
            z-index: 5;
        }

        .cell {
            position: relative;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .target-marker {
            position: absolute;
            width: 75%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top: 3px solid var(--neon-primary);
            border-bottom: 3px solid var(--neon-secondary);
            box-shadow: 0 0 15px var(--neon-primary), inset 0 0 10px var(--neon-secondary);
            animation: spinAndPulse 1.2s linear infinite;
            z-index: 10;
        }

        @keyframes spinAndPulse {
            0% { transform: rotate(0deg) scale(0.9); opacity: 0.8; }
            50% { transform: rotate(180deg) scale(1.1); opacity: 1; box-shadow: 0 0 25px var(--neon-primary); }
            100% { transform: rotate(360deg) scale(0.9); opacity: 0.8; }
        }

        /* عناصر التحكم */
        .controls-section {
            background: rgba(10, 1, 18, 0.75);
            backdrop-filter: blur(5px);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(42, 8, 69, 0.8);
        }

        .input-group label {
            display: block;
            color: #ccc;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-primary);
            color: var(--neon-primary);
            font-size: 1.5em;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 0 15px rgba(162, 0, 255, 0.2);
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-predict {
            background: linear-gradient(45deg, #4a0080, var(--neon-primary));
            color: #fff;
            box-shadow: 0 0 15px rgba(162, 0, 255, 0.4);
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 0, 234, 0.6);
            background: linear-gradient(45deg, var(--neon-primary), var(--neon-secondary));
        }

        /* حالة الزر عندما يكون العداد يعمل */
        .btn-predict.disabled {
            background: #333 !important;
            color: #777 !important;
            box-shadow: none !important;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-link {
            background: rgba(17, 17, 17, 0.8);
            color: #aaa;
            border: 1px solid #333;
            display: block;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 15px;
            font-size: 0.9em;
        }
        
        .btn-link:hover { background: rgba(26, 5, 37, 0.9); border-color: var(--neon-primary); color: #fff; }

        /* منطقة النتائج */
        .stats-box {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        .stat-item {
            flex: 1;
            background: rgba(5, 0, 10, 0.8);
            border: 1px solid #2a0845;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .stat-item .num {
            font-size: 2.2em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #fff;
        }
        
        .stat-item .prob {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .high-prob { border-color: var(--neon-primary); box-shadow: 0 0 15px rgba(162, 0, 255, 0.15); }
        .high-prob .prob { color: var(--neon-primary); }
        
        .medium-prob { border-color: var(--neon-secondary); }
        .medium-prob .prob { color: var(--neon-secondary); }

        /* ستايل العداد الدائري الجديد (الخط الأصفر المضيء) */
        .timer-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            z-index: 1000;
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 80px;
            height: 80px;
        }

        .timer-bg {
            fill: none;
            stroke: rgba(255, 215, 0, 0.15);
            stroke-width: 5;
        }

        .timer-progress {
            fill: none;
            stroke: var(--timer-color);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 226; /* محيط الدائرة (2 * pi * r) = 2 * 3.14 * 36 */
            stroke-dashoffset: 0;
            filter: drop-shadow(0 0 10px var(--timer-color));
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--timer-color);
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--timer-color);
        }

    </style>
</head>
<body>

    <!-- مؤثرات الخلفية -->
    <div class="animated-background"></div>
    <div class="scanning-lines"></div>

    <div class="main-container">
        <h2>Advanced AI Core</h2>
        
        <div class="board-wrapper">
            <img src="ses.jpg" alt="Roulette Board">
            
            <div class="grid-overlay" id="gridOverlay">
                <!-- يتم حقن الخلايا عبر الجافاسكربت -->
            </div>
        </div>

        <div class="controls-section">
            <div class="input-group">
                <label>Enter Last Winning Number:</label>
                <input type="number" id="numInput" min="0" max="36" placeholder="Auto-Predict Active">
            </div>

            <!-- زر البدء -->
            <button class="btn btn-predict" id="predictBtn" onclick="runAnalysis()">Initialize Algorithm</button>
            
            <a href="https://m.dubibet365.com/" target="_blank" class="btn btn-link">CONNECT TO DUBIBET SERVER</a>

            <div class="stats-box" id="statsBox" style="display: none;">
                <div class="stat-item high-prob">
                    <div class="num" id="res1-num">--</div>
                    <div class="prob">High Match: <span id="res1-prob">--%</span></div>
                </div>
                <div class="stat-item medium-prob">
                    <div class="num" id="res2-num">--</div>
                    <div class="prob">Med Match: <span id="res2-prob">--%</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- العداد الدائري الجديد -->
    <div class="timer-container">
        <svg class="timer-svg" viewBox="0 0 80 80">
            <circle class="timer-bg" cx="40" cy="40" r="36"></circle>
            <circle class="timer-progress" id="timerProgress" cx="40" cy="40" r="36"></circle>
        </svg>
        <div class="timer-text" id="timerText">0</div>
    </div>

    <script>
        const gridOverlay = document.getElementById('gridOverlay');
        const cells = {}; 
        
        // متغيرات العداد
        let isTimerRunning = false;
        const totalTime = 18;
        const timerProgress = document.getElementById('timerProgress');
        const timerText = document.getElementById('timerText');
        const predictBtn = document.getElementById('predictBtn');
        const circumference = 226; // 2 * Math.PI * 36

        // تهيئة العداد على الصفر في البداية (جاهز)
        timerProgress.style.strokeDashoffset = circumference;
        timerText.innerText = "RDY";

        function initGrid() {
            for (let i = 0; i <= 36; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                
                if (i === 0) {
                    cell.style.gridColumn = '1';
                    cell.style.gridRow = '1 / 4';
                } else {
                    let col = Math.ceil(i / 3) + 1;
                    let row = (i % 3 === 0) ? 1 : (i % 3 === 2) ? 2 : 3;
                    cell.style.gridColumn = col;
                    cell.style.gridRow = row;
                }
                
                gridOverlay.appendChild(cell);
                cells[i] = cell;
            }
        }
        initGrid();

        const wheelSequence = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];

        function startTimer() {
            isTimerRunning = true;
            predictBtn.classList.add('disabled');
            let timeLeft = totalTime;
            
            // إعادة ضبط الشكل للبداية
            timerProgress.style.transition = 'none';
            timerProgress.style.strokeDashoffset = '0';
            timerText.innerText = timeLeft;
            timerText.style.fontSize = "24px";

            // إضافة الأنيميشن (خط يدور ببطء لينتهي مع الوقت)
            setTimeout(() => {
                timerProgress.style.transition = `stroke-dashoffset ${totalTime}s linear`;
                timerProgress.style.strokeDashoffset = circumference;
            }, 50);

            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerText.innerText = timeLeft;
                } else {
                    clearInterval(countdown);
                    isTimerRunning = false;
                    predictBtn.classList.remove('disabled');
                    timerText.innerText = "RDY";
                    timerText.style.fontSize = "20px";
                }
            }, 1000);
        }

        function runAnalysis() {
            // منع بدء جولة جديدة إذا كان العداد يعمل
            if (isTimerRunning) return;

            let inputVal = parseInt(document.getElementById('numInput').value);

            if (isNaN(inputVal) || inputVal < 0 || inputVal > 36) {
                inputVal = Math.floor(Math.random() * 37); 
            }

            // مسح العلامات السابقة
            document.querySelectorAll('.target-marker').forEach(el => el.remove());
            document.getElementById('statsBox').style.display = 'none';

            // تشغيل العداد فوراً
            startTimer();
            
            // إظهار النتائج بعد ثانية تقريباً (لإعطاء شعور بالتحليل)
            setTimeout(() => {
                const currentIndex = wheelSequence.indexOf(inputVal);
                
                let index1 = (currentIndex + 5) % 37;
                let index2 = (currentIndex - 4 + 37) % 37; 

                let num1 = wheelSequence[index1];
                let num2 = wheelSequence[index2];

                let prob1 = Math.floor(Math.random() * (85 - 70 + 1)) + 70; 
                let prob2 = Math.floor(Math.random() * ((prob1 - 10) - 50 + 1)) + 50; 

                document.getElementById('statsBox').style.display = 'flex';
                document.getElementById('res1-num').innerText = num1;
                document.getElementById('res1-prob').innerText = prob1 + '%';
                document.getElementById('res2-num').innerText = num2;
                document.getElementById('res2-prob').innerText = prob2 + '%';

                drawMarker(num1);
                drawMarker(num2);
            }, 1000);
        }

        function drawMarker(number) {
            const targetCell = cells[number];
            if (targetCell) {
                const marker = document.createElement('div');
                marker.className = 'target-marker';
                targetCell.appendChild(marker);
            }
        }
    </script>
</body>
</html>
