<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محلل الروليت الذكي - النسخة المستقلة</title>
    <style>
        /* إزالة الحواف وجعل الصفحة تملأ الشاشة */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; 
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* إطار الكازينو محقون عبر بروكسي لتخطي الحماية */
        #casino-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* تصميم الشاشة المنبثقة (Overlay) لتكون عائمة */
        #analyzer-overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px; 
            background-color: rgba(34, 34, 34, 0.95);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 9999; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.7);
            border: 1px solid #555;
            cursor: grab;
        }
        
        #analyzer-overlay:active { cursor: grabbing; }

        #analyzer-overlay h2 {
            font-size: 1.2em;
            margin-top: 0;
            text-align: center;
            pointer-events: none;
        }

        .controls input, .controls button {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
            border-radius: 5px;
            font-size: 1em;
        }

        .controls button {
            background-color: #e50000;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .controls button:hover { background-color: #ff1a1a; }

        #result {
            margin-top: 15px;
            padding: 10px;
            background: #222;
            text-align: center;
            font-size: 1.1em;
            border-radius: 5px;
            font-weight: bold;
        }

        /* زر الإغلاق/التصغير */
        #toggle-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #555;
            border: none;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2em;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- تم استخدام CORS Proxy لكسر حماية X-Frame-Options وفتح الموقع داخل iframe -->
    <iframe id="casino-frame" src="https://corsproxy.io/?https://m.dubibet365.com/"></iframe>

    <!-- نافذة المحلل العائمة -->
    <div id="analyzer-overlay" class="controls">
        <button id="toggle-btn" onclick="toggleAnalyzer()">-</button>
        <h2>محلل الروليت الذكي</h2>
        
        <div id="analyzer-content">
            <label style="font-size: 0.9em; display:block; margin-bottom: 5px;">أدخل آخر رقم ظهر:</label>
            <input type="number" id="lastNumber" min="0" max="36" placeholder="مثال: 34">
            <button onclick="addNumber()">تسجيل الرقم</button>
            <button onclick="predict()">توليد تخمين إحصائي</button>
            <div id="result">بانتظار البيانات... (0/5)</div>
        </div>
    </div>

    <script>
        // --- 1. منطق الخوارزمية ---
        let history = [];
        
        function addNumber() {
            const num = parseInt(document.getElementById('lastNumber').value);
            if (!isNaN(num) && num >= 0 && num <= 36) {
                history.push(num);
                document.getElementById('lastNumber').value = '';
                if (history.length > 20) history.shift();
                updateStatus();
            }
        }

        function updateStatus() {
            if (history.length < 5) {
                document.getElementById('result').innerText = `بانتظار البيانات... (${history.length}/5)`;
                document.getElementById('result').style.color = "white";
            } else {
                document.getElementById('result').innerText = "البيانات كافية.. جاهز للتخمين!";
                document.getElementById('result').style.color = "#00ff00";
            }
        }

        function predict() {
            if (history.length < 5) {
                alert("يرجى إدخال 5 أرقام على الأقل حتى تتمكن الخوارزمية من العمل.");
                return;
            }
            
            let allNumbers = Array.from({length: 37}, (_, i) => i);
            let recentNumbers = history.slice(-5);
            let availableNumbers = allNumbers.filter(n => !recentNumbers.includes(n));
            
            let randomIndex = Math.floor(Math.random() * availableNumbers.length);
            let prediction = availableNumbers[randomIndex];
            
            document.getElementById('result').innerHTML = "<span style='color:#ffeb3b; font-size: 1.3em;'> التوقع: " + prediction + "</span>";
        }

        // --- 2. منطق إخفاء/إظهار النافذة ---
        let contentVisible = true;
        function toggleAnalyzer() {
            const content = document.getElementById('analyzer-content');
            const btn = document.getElementById('toggle-btn');
            if (contentVisible) {
                content.style.display = 'none';
                btn.innerText = '+';
            } else {
                content.style.display = 'block';
                btn.innerText = '-';
            }
            contentVisible = !contentVisible;
        }

        // --- 3. منطق السحب والإفلات (Drag functionality) ---
        const overlay = document.getElementById('analyzer-overlay');
        let isDragging = false, startX, startY, initialX, initialY;

        overlay.addEventListener('mousedown', function(e) {
            if(['INPUT', 'BUTTON', 'LABEL'].includes(e.target.tagName)) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialX = overlay.offsetLeft;
            initialY = overlay.offsetTop;
            overlay.style.right = 'auto'; 
        });

        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;
                overlay.style.left = (initialX + dx) + 'px';
                overlay.style.top = (initialY + dy) + 'px';
            }
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
    </script>
</body>
</html>
