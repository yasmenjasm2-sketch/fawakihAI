<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubibet Smart Analyzer - نظام التخمين بالمسافات</title>
    <style>
        :root {
            --main-bg: #0a0a0a;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --accent-red: #d32f2f;
            --accent-green: #00e676;
            --text-color: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Courier New', Courier, monospace; /* خط يشبه شاشات الاختراق والتحليل */
            background-color: var(--main-bg);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* العلامة المائية المتحركة برمجياً */
        #watermark-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200vw;
            height: 200vh;
            background-image: url('ses.jpg');
            background-repeat: repeat;
            opacity: 0.15; /* شفافية خفيفة لعدم التشويش على الواجهة */
            z-index: 0;
            pointer-events: none;
            animation: panBackground 40s linear infinite;
        }

        @keyframes panBackground {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50%, -50%); }
        }

        /* الحاوية الرئيسية للأداة */
        .analyzer-container {
            position: relative;
            z-index: 10;
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(211, 47, 47, 0.2);
            backdrop-filter: blur(5px);
        }

        h2 {
            text-align: center;
            color: #fff;
            margin-top: 0;
            font-size: 1.5em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #444;
            padding-bottom: 15px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #444;
            color: #fff;
            font-size: 1.2em;
            border-radius: 6px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-red);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            font-size: 1.1em;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: bold;
        }

        button:hover { background-color: #444; }

        .btn-predict {
            background-color: var(--accent-red);
            border-color: #b71c1c;
        }
        .btn-predict:hover { background-color: #f44336; box-shadow: 0 0 10px rgba(244, 67, 54, 0.5); }

        .btn-link {
            background-color: #1565c0;
            border-color: #0d47a1;
            text-decoration: none;
            display: block;
            text-align: center;
            box-sizing: border-box;
        }
        .btn-link:hover { background-color: #1976d2; }

        .result-box {
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .history-bar {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .history-item {
            background: #222;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            border: 1px solid #444;
        }

        /* نافذة محاكاة الاتصال بالسيرفر (Fake Terminal) */
        .terminal-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid #333;
            padding: 10px 20px;
            font-size: 0.85em;
            color: #00e676; /* لون أخضر مثل الطرفية */
            box-sizing: border-box;
            z-index: 10;
            height: 80px;
            overflow-y: hidden;
        }

        .terminal-line {
            margin: 3px 0;
            opacity: 0;
            animation: fadeIn 0.1s forwards;
        }

        .sys-err { color: #ff5252; }
        .sys-warn { color: #ffd600; }

        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <!-- العلامة المائية المتحركة -->
    <div id="watermark-bg"></div>

    <!-- واجهة التحليل -->
    <div class="analyzer-container">
        <h2>نظام تحليل روليت دوبيب</h2>
        
        <div class="history-bar" id="history-display">
            <!-- سيتم إضافة الأرقام السابقة هنا -->
        </div>

        <div class="input-group">
            <label>أدخل الرقم الرابح الأخير:</label>
            <input type="number" id="numInput" min="0" max="36" placeholder="مثال: 34" onkeypress="handleEnter(event)">
        </div>

        <button onclick="addNumber()">تسجيل وتحديث الخوارزمية</button>
        <button class="btn-predict" onclick="calculatePrediction()">توليد التخمين (حسب مسافات العجلة)</button>
        
        <div class="result-box" id="prediction-result">
            <span style="color: #888;">بانتظار إدخال البيانات...</span>
        </div>

        <!-- زر الانتقال للموقع الرسمي -->
        <a href="https://m.dubibet365.com/" target="_blank" style="text-decoration: none;">
            <button class="btn-link">انتقل لروليت دوبيب شوف</button>
        </a>
    </div>

    <!-- شريط الاتصال الوهمي (Fake API Connection) -->
    <div class="terminal-container" id="terminal">
        <!-- سيتم حقن سطور الاتصال هنا عبر الجافاسكربت -->
    </div>

    <script>
        // --- 1. محاكاة الاتصال بالسيرفر الوهمي ---
        const terminal = document.getElementById('terminal');
        const bootSequence = [
            { text: "[sys] Initializing secure core module...", delay: 500 },
            { text: "[network] Resolving host: https://m.dubibet365.com/.api", delay: 1200 },
            { text: "[network] Establishing WSS (WebSocket Secure) connection...", delay: 2500 },
            { text: "[auth] Bypassing SSL pinning & handshaking...", delay: 3800, class: "sys-warn" },
            { text: "[api] Token synchronized. Fetching live seed...", delay: 5000 },
            { text: "[+] Connection Established! Link to dubibet365 is ACTIVE.", delay: 6500, class: "sys-success" }
        ];

        let currentTerminalTimeout;
        function runTerminalSequence() {
            terminal.innerHTML = '';
            bootSequence.forEach(step => {
                setTimeout(() => {
                    const line = document.createElement('div');
                    line.className = 'terminal-line ' + (step.class || '');
                    line.innerText = `> ${step.text}`;
                    terminal.appendChild(line);
                    // التمرير التلقائي للأسفل
                    terminal.scrollTop = terminal.scrollHeight;
                }, step.delay);
            });
            
            // إضافة سطر حيوي متكرر ليعطي انطباع الاتصال المستمر
            setTimeout(() => {
                setInterval(() => {
                    const ping = document.createElement('div');
                    ping.className = 'terminal-line';
                    ping.innerText = `> [api] Ping... latency: ${Math.floor(Math.random() * 40 + 10)}ms`;
                    terminal.appendChild(ping);
                    if(terminal.children.length > 5) terminal.removeChild(terminal.firstChild);
                }, 4000);
            }, 7000);
        }

        window.onload = runTerminalSequence;

        // --- 2. خوارزمية المسافات (الترتيب الفعلي لعجلة الروليت الأوروبية) ---
        // ترتيب الأرقام كما هي محفورة فعلياً على عجلة الروليت (العجلة الأوروبية ذات الصفر الواحد)
        const wheelSequence = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        
        let numberHistory = [];

        function handleEnter(e) {
            if (e.key === 'Enter') addNumber();
        }

        function addNumber() {
            const input = document.getElementById('numInput');
            const val = parseInt(input.value);

            if (isNaN(val) || val < 0 || val > 36) {
                alert("يرجى إدخال رقم صحيح بين 0 و 36");
                return;
            }

            numberHistory.push(val);
            if (numberHistory.length > 5) {
                numberHistory.shift(); // الاحتفاظ بآخر 5 أرقام فقط في الذاكرة للعرض
            }

            input.value = '';
            updateHistoryUI();
            
            // محاكاة إرسال البيانات للسيرفر الوهمي
            const sendLine = document.createElement('div');
            sendLine.className = 'terminal-line sys-warn';
            sendLine.innerText = `> [tx] Injecting seed data [${val}] to https://m.dubibet365.com/.api/calc...`;
            terminal.appendChild(sendLine);
            if(terminal.children.length > 5) terminal.removeChild(terminal.firstChild);
        }

        function updateHistoryUI() {
            const container = document.getElementById('history-display');
            container.innerHTML = '';
            numberHistory.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                // تلوين الأرقام (أحمر، أسود، أخضر) بناءً على الروليت القياسي
                const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
                if(num === 0) item.style.color = "#00e676";
                else if(redNumbers.includes(num)) item.style.color = "#ff5252";
                else item.style.color = "#ffffff";
                
                item.innerText = num;
                container.appendChild(item);
            });
        }

        function calculatePrediction() {
            if (numberHistory.length === 0) {
                alert("أدخل رقماً واحداً على الأقل لتبدأ خوارزمية قياس المسافات.");
                return;
            }

            const resultBox = document.getElementById('prediction-result');
            resultBox.innerHTML = "<span style='color: #ffd600;'>[جاري حساب زوايا العجلة واسترجاع البيانات...]</span>";

            //หน่วงเวลา لإعطاء شعور بالمعالجة الحقيقية
            setTimeout(() => {
                const lastNum = numberHistory[numberHistory.length - 1];
                const currentIndex = wheelSequence.indexOf(lastNum);

                // الخوارزمية: تأخذ أرقام تبعد مسافات محددة على عجلة الروليت (مثلاً +5 خطوات، -5 خطوات، و +10 خطوات)
                // هذا يحاكي نظرية قطاعات العجلة (Wheel Sectors)
                const distanceOffsets = [4, -4, 9, -9]; 
                let predictedNumbers = [];

                distanceOffsets.forEach(offset => {
                    // حساب المؤشر الدائري لكي لا يخرج عن نطاق الـ 37 رقم
                    let calcIndex = (currentIndex + offset) % 37;
                    if (calcIndex < 0) calcIndex += 37;
                    predictedNumbers.push(wheelSequence[calcIndex]);
                });

                // تنسيق الأرقام المتوقعة
                const formattedPredictions = predictedNumbers.join(' - ');
                resultBox.innerHTML = `
                    <div>
                        <span style="font-size: 0.6em; color: #aaa; display: block; margin-bottom: 5px;">المنطقة المتوقعة (بناءً على مسافات العجلة):</span>
                        <strong style="color: #00e676; font-size: 1.4em; letter-spacing: 2px;">${formattedPredictions}</strong>
                    </div>
                `;

                // إضافة لوق الاستلام في الطرفية الوهمية
                const recvLine = document.createElement('div');
                recvLine.className = 'terminal-line sys-success';
                recvLine.innerText = `> [rx] Payload received from dubibet365.api -> Sectors: [${formattedPredictions}]`;
                terminal.appendChild(recvLine);
                if(terminal.children.length > 5) terminal.removeChild(terminal.firstChild);

            }, 1200); // 1.2 ثانية تأخير
        }
    </script>
</body>
</html>
