<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubibet Pro Analyzer - AI Core</title>
    <style>
        :root {
            --bg-color: #08000f;
            --neon-primary: #a200ff;
            --neon-secondary: #ff00ea;
            --neon-tertiary: #00eaff; /* لون للخانة الثالثة */
            --timer-color: #ffd700; 
            --text-glow: 0 0 10px rgba(162, 0, 255, 0.5);
            --danger-color: #ff3366;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Consolas', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding-bottom: 100px; 
        }

        /* رسالة التحذير المنزلقة */
        .warning-alert {
            position: fixed;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #8b0000, #ff0033);
            color: white;
            padding: 15px 20px;
            border-radius: 0 0 15px 15px;
            border: 2px solid #ff3366;
            border-top: none;
            box-shadow: 0 5px 25px rgba(255, 51, 102, 0.6);
            z-index: 9999;
            font-weight: bold;
            font-size: 0.9em;
            text-align: center;
            width: 90%;
            max-width: 500px;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            line-height: 1.5;
        }

        .warning-alert.show {
            top: 0;
        }

        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(162, 0, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(162, 0, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -2;
        }

        .scanning-lines {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(162, 0, 255, 0.3), transparent);
            animation: scan 3s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -100%; }
            100% { top: 100%; }
        }

        .main-container {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            padding: 20px;
            box-sizing: border-box;
            background: transparent;
            z-index: 10;
        }

        h2 {
            text-align: center;
            color: var(--neon-primary);
            text-shadow: var(--text-glow);
            margin-top: 0;
            font-size: 1.5em;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(58, 13, 89, 0.5);
            padding-bottom: 15px;
            text-transform: uppercase;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 25px;
            border: none;
            box-shadow: none;
            background: transparent;
        }

        .board-wrapper img {
            width: 100%;
            display: block;
            border-radius: 5px; 
        }

        .grid-overlay {
            position: absolute;
            top: 17.5%;      
            left: 2.8%;      
            width: 94.5%;    
            height: 33.5%;   
            display: grid;
            grid-template-columns: 1.15fr repeat(12, 1fr) 0.9fr; 
            grid-template-rows: repeat(3, 1fr);
            z-index: 5;
        }

        .cell {
            position: relative;
            pointer-events: none;
            display: block; 
        }

        .target-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 75%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top: 3px solid var(--neon-primary);
            border-bottom: 3px solid var(--neon-secondary);
            box-shadow: 0 0 15px var(--neon-primary), inset 0 0 10px var(--neon-secondary);
            animation: spinAndPulse 1.2s linear infinite;
            z-index: 10;
        }

        @keyframes spinAndPulse {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.9); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.1); opacity: 1; box-shadow: 0 0 25px var(--neon-primary); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(0.9); opacity: 0.8; }
        }

        .controls-section {
            background: rgba(10, 1, 18, 0.75);
            backdrop-filter: blur(5px);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(42, 8, 69, 0.8);
        }

        .input-group label {
            display: block;
            color: #ccc;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-primary);
            color: var(--neon-primary);
            font-size: 1.5em;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 0 15px rgba(162, 0, 255, 0.2);
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-predict {
            background: linear-gradient(45deg, #4a0080, var(--neon-primary));
            color: #fff;
            box-shadow: 0 0 15px rgba(162, 0, 255, 0.4);
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 0, 234, 0.6);
            background: linear-gradient(45deg, var(--neon-primary), var(--neon-secondary));
        }

        .btn-predict.disabled {
            background: #333 !important;
            color: #777 !important;
            box-shadow: none !important;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-link {
            background: rgba(17, 17, 17, 0.8);
            color: #aaa;
            border: 1px solid #333;
            display: block;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 15px;
            font-size: 0.9em;
        }
        
        .btn-link:hover { background: rgba(26, 5, 37, 0.9); border-color: var(--neon-primary); color: #fff; }

        .stats-box {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 8px;
        }

        .stat-item {
            flex: 1;
            background: rgba(5, 0, 10, 0.8);
            border: 1px solid #2a0845;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .stat-item .num {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #fff;
        }
        
        .stat-item .prob {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .high-prob { border-color: var(--neon-primary); box-shadow: 0 0 15px rgba(162, 0, 255, 0.15); }
        .high-prob .prob { color: var(--neon-primary); }
        
        .medium-prob { border-color: var(--neon-secondary); }
        .medium-prob .prob { color: var(--neon-secondary); }

        .low-prob { border-color: var(--neon-tertiary); box-shadow: 0 0 15px rgba(0, 234, 255, 0.15); }
        .low-prob .prob { color: var(--neon-tertiary); }

        .timer-container {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px; 
            height: 70px;
            z-index: 1000;
            background: rgba(8, 0, 15, 0.8); 
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 70px;
            height: 70px;
        }

        .timer-bg {
            fill: none;
            stroke: rgba(255, 215, 0, 0.15);
            stroke-width: 5;
        }

        .timer-progress {
            fill: none;
            stroke: var(--timer-color);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 188.4; 
            stroke-dashoffset: 0;
            filter: drop-shadow(0 0 8px var(--timer-color));
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--timer-color);
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--timer-color);
        }

    </style>
</head>
<body>

    <!-- رسالة التحذير -->
    <div id="warningMsg" class="warning-alert">
        ⚠️ تحذير: يجب عليك تسجيل الرقم السابق من موقع <br><strong>m.dubibet365.com</strong> لضمان دقة الخوارزمية.<br>تم تفعيل التخمين العشوائي كبديل حالياً!
    </div>

    <div class="animated-background"></div>
    <div class="scanning-lines"></div>

    <div class="main-container">
        <h2>Roulette Radar </h2>
        
        <div class="board-wrapper">
            <img src="ses.jpg" alt="Roulette Board">
            
            <div class="grid-overlay" id="gridOverlay">
                <!-- يتم حقن الخلايا عبر الجافاسكربت -->
            </div>
        </div>

        <div class="controls-section">
            <div class="input-group">
                <label>Enter Last Winning Number:</label>
                <input type="number" id="numInput" min="0" max="36" placeholder="Auto-Predict Active">
            </div>

            <button class="btn btn-predict" id="predictBtn" onclick="runAnalysis()">Initialize Algorithm</button>
            
            <a href="https://m.dubibet365.com/" target="_blank" class="btn btn-link">CONNECT TO DUBIBET SERVER</a>

            <div class="stats-box" id="statsBox" style="display: none;">
                <div class="stat-item high-prob">
                    <div class="num" id="res1-num">--</div>
                    <div class="prob">High: <span id="res1-prob">--%</span></div>
                </div>
                <div class="stat-item medium-prob">
                    <div class="num" id="res2-num">--</div>
                    <div class="prob">Med: <span id="res2-prob">--%</span></div>
                </div>
                <div class="stat-item low-prob">
                    <div class="num" id="res3-num">--</div>
                    <div class="prob">Low: <span id="res3-prob">--%</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="timer-container">
        <svg class="timer-svg" viewBox="0 0 70 70">
            <circle class="timer-bg" cx="35" cy="35" r="30"></circle>
            <circle class="timer-progress" id="timerProgress" cx="35" cy="35" r="30"></circle>
        </svg>
        <div class="timer-text" id="timerText">RDY</div>
    </div>

    <script>
        const gridOverlay = document.getElementById('gridOverlay');
        const cells = {}; 
        
        let isTimerRunning = false;
        const totalTime = 18;
        const timerProgress = document.getElementById('timerProgress');
        const timerText = document.getElementById('timerText');
        const predictBtn = document.getElementById('predictBtn');
        const circumference = 188.4; 

        // قائمة الأرقام المستثناة لمدة 3 جولات
        let excludedNumbersHistory = [];

        timerProgress.style.strokeDashoffset = circumference;
        timerText.innerText = "RDY";

        function initGrid() {
            for (let i = 0; i <= 36; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                
                if (i === 0) {
                    cell.style.gridColumn = '1';
                    cell.style.gridRow = '1 / 4';
                } else {
                    let col = Math.ceil(i / 3) + 1;
                    let row = (i % 3 === 0) ? 1 : (i % 3 === 2) ? 2 : 3;
                    cell.style.gridColumn = col;
                    cell.style.gridRow = row;
                }
                
                gridOverlay.appendChild(cell);
                cells[i] = cell;
            }
        }
        initGrid();

        // تسلسل عجلة الروليت الحقيقية
        const wheelSequence = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];

        function startTimer() {
            isTimerRunning = true;
            predictBtn.classList.add('disabled');
            let timeLeft = totalTime;
            
            timerProgress.style.transition = 'none';
            timerProgress.style.strokeDashoffset = '0';
            timerText.innerText = timeLeft;
            timerText.style.fontSize = "22px";

            setTimeout(() => {
                timerProgress.style.transition = `stroke-dashoffset ${totalTime}s linear`;
                timerProgress.style.strokeDashoffset = circumference;
            }, 50);

            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerText.innerText = timeLeft;
                } else {
                    clearInterval(countdown);
                    isTimerRunning = false;
                    predictBtn.classList.remove('disabled');
                    timerText.innerText = "RDY";
                    timerText.style.fontSize = "18px";
                }
            }, 1000);
        }

        // تحديث جولات الاستثناء التاريخية
        function updateExclusions() {
            for(let i = excludedNumbersHistory.length - 1; i >= 0; i--) {
                excludedNumbersHistory[i].roundsLeft--;
                if(excludedNumbersHistory[i].roundsLeft <= 0) {
                    excludedNumbersHistory.splice(i, 1); 
                }
            }
        }

        // التحقق مما إذا كان الرقم مستثنى (من التاريخ أو من الجولة الحالية)
        function isExcluded(num, currentExclusions) {
            // هل هو في قائمة الـ 5 أرقام المستبعدة حالياً؟
            if (currentExclusions.includes(num)) return true;
            
            // هل هو في تاريخ الأرقام المستبعدة لـ 3 جولات؟
            return excludedNumbersHistory.some(item => item.num === num);
        }

        function runAnalysis() {
            if (isTimerRunning) return;

            const inputStr = document.getElementById('numInput').value;
            let inputVal = parseInt(inputStr);
            let hasValidInput = true;
            
            // قائمة الأرقام الـ 5 المستبعدة في هذه الجولة (الرقم نفسه + 2 يمين + 2 يسار)
            let currentExclusions = [];

            // تحديث عداد الجولات للأرقام المستثناة السابقة
            updateExclusions();

            // فحص إدخال المستخدم
            if (inputStr === "" || isNaN(inputVal) || inputVal < 0 || inputVal > 36) {
                hasValidInput = false;
                // إظهار رسالة التحذير المنزلقة
                const warningMsg = document.getElementById('warningMsg');
                warningMsg.classList.add('show');
                setTimeout(() => {
                    warningMsg.classList.remove('show');
                }, 4000);
            } else {
                // إذا أدخل رقم، نضيفه إلى قائمة الاستثناء التاريخية لـ 3 جولات
                let existing = excludedNumbersHistory.find(x => x.num === inputVal);
                if (existing) {
                    existing.roundsLeft = 3;
                } else {
                    excludedNumbersHistory.push({ num: inputVal, roundsLeft: 3 });
                }

                // حساب الأرقام الـ 5 المجاورة له (الرقم نفسه + 2 عن يمينه + 2 عن يساره) واستبعادها
                const currentIndex = wheelSequence.indexOf(inputVal);
                
                let idxLeft2 = (currentIndex - 2 + 37) % 37;
                let idxLeft1 = (currentIndex - 1 + 37) % 37;
                let idxSelf  = currentIndex;
                let idxRight1= (currentIndex + 1) % 37;
                let idxRight2= (currentIndex + 2) % 37;

                currentExclusions.push(wheelSequence[idxLeft2]);
                currentExclusions.push(wheelSequence[idxLeft1]);
                currentExclusions.push(wheelSequence[idxSelf]);
                currentExclusions.push(wheelSequence[idxRight1]);
                currentExclusions.push(wheelSequence[idxRight2]);
                
                // يمكنك طباعة الأرقام المستبعدة في الكونسول للتأكد من عملها
                console.log("الرقم المدخل:", inputVal, " | الأرقام الـ 5 المستبعدة جواره:", currentExclusions);
            }

            document.querySelectorAll('.target-marker').forEach(el => el.remove());
            document.getElementById('statsBox').style.display = 'none';

            startTimer();
            
            setTimeout(() => {
                let predictions = [];

                if (hasValidInput) {
                    // التخمين من باقي أجزاء العجلة بعيداً عن المنطقة المستبعدة
                    const currentIndex = wheelSequence.indexOf(inputVal);
                    // مسافات أبعد في العجلة (تتجاوز الـ 2 يمين و 2 يسار)
                    let offsets = [8, -7, 12, -14, 18, -10, 15]; 
                    for(let i=0; i<offsets.length; i++) {
                        let idx = (currentIndex + offsets[i] + 37) % 37;
                        let cand = wheelSequence[idx];
                        
                        // نتحقق أن الرقم المرشح ليس مستبعداً (لا من الـ 5 أرقام المجاورة، ولا من الجولات السابقة)
                        if(!isExcluded(cand, currentExclusions) && !predictions.includes(cand)) {
                            predictions.push(cand);
                        }
                        if(predictions.length === 3) break;
                    }
                }

                // إكمال التخمين العشوائي الذكي (إذا لم يدخل رقم، أو إذا لم تكتمل الـ 3 أرقام)
                while (predictions.length < 3) {
                    let randNum = Math.floor(Math.random() * 37);
                    if (!isExcluded(randNum, currentExclusions) && !predictions.includes(randNum)) {
                        predictions.push(randNum);
                    }
                }

                // تحديد نسب النجاح للثلاث أرقام
                let prob1 = Math.floor(Math.random() * (95 - 82 + 1)) + 82; 
                let prob2 = Math.floor(Math.random() * (80 - 65 + 1)) + 65; 
                let prob3 = Math.floor(Math.random() * (62 - 45 + 1)) + 45; 

                document.getElementById('statsBox').style.display = 'flex';
                
                // الخانة الأولى
                document.getElementById('res1-num').innerText = predictions[0];
                document.getElementById('res1-prob').innerText = prob1 + '%';
                
                // الخانة الثانية
                document.getElementById('res2-num').innerText = predictions[1];
                document.getElementById('res2-prob').innerText = prob2 + '%';

                // الخانة الثالثة
                document.getElementById('res3-num').innerText = predictions[2];
                document.getElementById('res3-prob').innerText = prob3 + '%';

                // رسم الرادارات على الخريطة
                drawMarker(predictions[0]);
                drawMarker(predictions[1]);
                drawMarker(predictions[2]);

            }, 1000);
        }

        function drawMarker(number) {
            const targetCell = cells[number];
            if (targetCell) {
                const marker = document.createElement('div');
                marker.className = 'target-marker';
                targetCell.appendChild(marker);
            }
        }
    </script>
</body>
</html>
