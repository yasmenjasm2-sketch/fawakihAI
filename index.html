<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubibet Pro Analyzer - AI Core</title>
    <style>
        :root {
            /* السمة البنفسجية الاحترافية */
            --bg-color: #08000f;
            --neon-primary: #a200ff;
            --neon-secondary: #ff00ea;
            --panel-bg: #110518;
            --text-glow: 0 0 10px rgba(162, 0, 255, 0.5);
            --border-glow: 0 0 15px rgba(162, 0, 255, 0.3);
            --danger-color: #ff3366;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Consolas', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* تأثير الخطوط المتحركة في الخلفية */
        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(162, 0, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(162, 0, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -2;
        }

        .scanning-lines {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(162, 0, 255, 0.15), transparent);
            animation: scan 4s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -100%; }
            100% { top: 100%; }
        }

        /* حاوية الأداة المركزية */
        .main-container {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            margin-bottom: 110px; /* لترك مساحة للـ Terminal */
            padding: 20px;
            box-sizing: border-box;
            background: var(--panel-bg);
            border: 1px solid #3a0d59;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), var(--border-glow);
            z-index: 10;
        }

        h2 {
            text-align: center;
            color: var(--neon-primary);
            text-shadow: var(--text-glow);
            margin-top: 0;
            font-size: 1.5em;
            letter-spacing: 2px;
            border-bottom: 1px solid #3a0d59;
            padding-bottom: 15px;
            text-transform: uppercase;
        }

        /* لوحة الروليت */
        .board-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 25px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,1);
            border: 1px solid #4a156e;
        }

        .board-wrapper img {
            width: 100%;
            display: block;
        }

        .grid-overlay {
            position: absolute;
            top: 15%; 
            left: 5.5%;
            width: 89.5%;
            height: 38%;
            display: grid;
            grid-template-columns: 1.15fr repeat(12, 1fr) 1fr;
            grid-template-rows: repeat(3, 1fr);
            z-index: 5;
        }

        .cell {
            position: relative;
            pointer-events: none;
        }

        /* العلامة الدائرية المتحركة الاحترافية */
        .target-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80%;
            height: 80%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid transparent;
            border-top: 3px solid var(--neon-primary);
            border-bottom: 3px solid var(--neon-secondary);
            box-shadow: 0 0 15px var(--neon-primary), inset 0 0 10px var(--neon-secondary);
            animation: spinAndPulse 1.2s linear infinite;
            z-index: 10;
        }

        .target-marker::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--neon-secondary);
        }

        @keyframes spinAndPulse {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.9); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.1); opacity: 1; box-shadow: 0 0 25px var(--neon-primary); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(0.9); opacity: 0.8; }
        }

        /* عناصر التحكم */
        .controls-section {
            background: #0a0112;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2a0845;
        }

        .input-group label {
            display: block;
            color: #aaa;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--neon-primary);
            color: var(--neon-primary);
            font-size: 1.5em;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 0 15px rgba(162, 0, 255, 0.2);
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-predict {
            background: linear-gradient(45deg, #4a0080, var(--neon-primary));
            color: #fff;
            box-shadow: 0 0 15px rgba(162, 0, 255, 0.4);
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 0, 234, 0.6);
            background: linear-gradient(45deg, var(--neon-primary), var(--neon-secondary));
        }

        .btn-link {
            background: #111;
            color: #aaa;
            border: 1px solid #333;
            display: block;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 15px;
            font-size: 0.9em;
        }
        .btn-link:hover { background: #1a0525; border-color: var(--neon-primary); color: #fff; }

        /* منطقة النتائج */
        .stats-box {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        .stat-item {
            flex: 1;
            background: #05000a;
            border: 1px solid #2a0845;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .stat-item .num {
            font-size: 2.2em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #fff;
        }
        
        .stat-item .prob {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .high-prob { border-color: var(--neon-primary); box-shadow: 0 0 15px rgba(162, 0, 255, 0.15); }
        .high-prob .prob { color: var(--neon-primary); }
        
        .medium-prob { border-color: var(--neon-secondary); }
        .medium-prob .prob { color: var(--neon-secondary); }

        /* شاشة الاتصال الوهمية (Terminal) الثابتة بالأسفل */
        .terminal-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 0, 10, 0.98);
            border-top: 1px solid var(--neon-primary);
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            color: var(--neon-primary);
            box-sizing: border-box;
            z-index: 100;
            height: 95px;
            overflow-y: hidden;
            box-shadow: 0 -5px 25px rgba(162, 0, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .terminal-line {
            margin: 3px 0;
            opacity: 0;
            animation: fadeIn 0.2s forwards;
            line-height: 1.4;
        }

        .sys-err { color: var(--danger-color); }
        .sys-warn { color: #ff00ea; }
        .sys-info { color: #00e5ff; }

        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <!-- مؤثرات الخلفية -->
    <div class="animated-background"></div>
    <div class="scanning-lines"></div>

    <div class="main-container">
        <h2>Advanced AI Core</h2>
        
        <div class="board-wrapper">
            <!-- استخدام اسم الصورة المطلوبة -->
            <img src="1000258780_2.jpg" alt="Roulette Board">
            
            <div class="grid-overlay" id="gridOverlay">
                <!-- يتم حقن الخلايا عبر الجافاسكربت -->
            </div>
        </div>

        <div class="controls-section">
            <div class="input-group">
                <label>Enter Last Winning Number:</label>
                <input type="number" id="numInput" min="0" max="36" placeholder="e.g. 22">
            </div>

            <button class="btn btn-predict" onclick="runAnalysis()">Initialize Algorithm</button>
            
            <a href="https://m.dubibet365.com/" target="_blank" class="btn btn-link">CONNECT TO DUBIBET SERVER</a>

            <div class="stats-box" id="statsBox" style="display: none;">
                <div class="stat-item high-prob">
                    <div class="num" id="res1-num">--</div>
                    <div class="prob">High Match: <span id="res1-prob">--%</span></div>
                </div>
                <div class="stat-item medium-prob">
                    <div class="num" id="res2-num">--</div>
                    <div class="prob">Med Match: <span id="res2-prob">--%</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Terminal -->
    <div class="terminal-container" id="terminal"></div>

    <script>
        const gridOverlay = document.getElementById('gridOverlay');
        const cells = {}; 

        function initGrid() {
            for (let i = 0; i <= 36; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                
                if (i === 0) {
                    cell.style.gridColumn = '1';
                    cell.style.gridRow = '1 / 4';
                } else {
                    let col = Math.ceil(i / 3) + 1;
                    let row = (i % 3 === 0) ? 1 : (i % 3 === 2) ? 2 : 3;
                    cell.style.gridColumn = col;
                    cell.style.gridRow = row;
                }
                
                gridOverlay.appendChild(cell);
                cells[i] = cell;
            }
        }
        initGrid();

        const wheelSequence = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];

        function runAnalysis() {
            const inputVal = parseInt(document.getElementById('numInput').value);
            if (isNaN(inputVal) || inputVal < 0 || inputVal > 36) {
                alert("SYSTEM ERROR: Invalid parameter. Enter 0-36.");
                return;
            }

            document.querySelectorAll('.target-marker').forEach(el => el.remove());
            document.getElementById('statsBox').style.display = 'none';

            // محاكاة إرسال الرقم للتعلم العميق في الخلفية
            logTerminal(`[tx] Encrypting input seed [${inputVal}]...`, 'sys-info');
            
            setTimeout(() => {
                logTerminal(`[net] Transmitting seed [${inputVal}] to Neural Node...`, 'sys-warn');
            }, 400);

            setTimeout(() => {
                logTerminal(`[rx] Pattern recognized. Mapping wheel physics...`, 'sys-info');
            }, 1000);

            setTimeout(() => {
                const currentIndex = wheelSequence.indexOf(inputVal);
                
                let index1 = (currentIndex + 5) % 37;
                let index2 = (currentIndex - 4 + 37) % 37; 

                let num1 = wheelSequence[index1];
                let num2 = wheelSequence[index2];

                let prob1 = Math.floor(Math.random() * (85 - 70 + 1)) + 70; 
                let prob2 = Math.floor(Math.random() * ((prob1 - 10) - 50 + 1)) + 50; 

                document.getElementById('statsBox').style.display = 'flex';
                document.getElementById('res1-num').innerText = num1;
                document.getElementById('res1-prob').innerText = prob1 + '%';
                document.getElementById('res2-num').innerText = num2;
                document.getElementById('res2-prob').innerText = prob2 + '%';

                drawMarker(num1);
                drawMarker(num2);

                logTerminal(`[ai] Targets locked: ${num1} (${prob1}%), ${num2} (${prob2}%)`, 'sys-warn');

            }, 1800);
        }

        function drawMarker(number) {
            const targetCell = cells[number];
            if (targetCell) {
                const marker = document.createElement('div');
                marker.className = 'target-marker';
                targetCell.appendChild(marker);
            }
        }

        const terminal = document.getElementById('terminal');
        const bootSequence = [
            { text: "[sys] Initializing Neural Network...", delay: 200 },
            { text: "[auth] Establishing secure SSL tunnel...", delay: 800 },
            { text: "[db] Loading historical spin data...", delay: 1500, class: "sys-warn" },
            { text: "[+] System Ready. Waiting for seed input.", delay: 2200, class: "sys-info" }
        ];

        function logTerminal(msg, className = '') {
            const line = document.createElement('div');
            line.className = 'terminal-line ' + className;
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });
            line.innerHTML = `<span style="color:#666">[${time}]</span> > ${msg}`;
            terminal.appendChild(line);
            
            if(terminal.children.length > 4) terminal.removeChild(terminal.firstChild);
        }

        window.onload = () => {
            bootSequence.forEach(step => {
                setTimeout(() => logTerminal(step.text, step.class), step.delay);
            });

            setTimeout(() => {
                setInterval(() => {
                    if(Math.random() > 0.5) {
                        logTerminal(`[ping] Server heartbeat: ${Math.floor(Math.random() * 20 + 15)}ms`);
                    }
                }, 6000);
            }, 3000);
        };
    </script>
</body>
</html>
