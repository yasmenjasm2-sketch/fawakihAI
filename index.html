<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubibet Pro Analyzer - الذكاء الاصطناعي</title>
    <style>
        :root {
            --bg-color: #070707;
            --neon-green: #00ff66;
            --neon-red: #ff3333;
            --panel-bg: #111111;
            --text-glow: 0 0 10px rgba(0, 255, 102, 0.5);
            --border-glow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* حاوية الأداة المركزية */
        .main-container {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            margin-bottom: 100px; /* لترك مساحة للـ Terminal */
            padding: 20px;
            box-sizing: border-box;
            background: var(--panel-bg);
            border: 1px solid #222;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), var(--border-glow);
        }

        h2 {
            text-align: center;
            color: var(--neon-green);
            text-shadow: var(--text-glow);
            margin-top: 0;
            font-size: 1.6em;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        /* --------------------------------------
           تصميم لوحة الروليت التفاعلية (الصورة)
           -------------------------------------- */
        .board-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 25px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,1);
            border: 1px solid #444;
        }

        .board-wrapper img {
            width: 100%;
            display: block;
        }

        /* 
           شبكة برمجية غير مرئية توضع فوق الصورة 
           مقسمة بدقة لتتطابق مع أرقام الروليت في الصورة 
        */
        .grid-overlay {
            position: absolute;
            /* هذه النسب التقريبية لمطابقة أبعاد لوحة الأرقام داخل صورتك */
            top: 15%; 
            left: 5.5%;
            width: 89.5%;
            height: 38%;
            display: grid;
            grid-template-columns: 1.15fr repeat(12, 1fr) 1fr; /* الصفر، 12 عمود للأرقام، 2to1 */
            grid-template-rows: repeat(3, 1fr);
            z-index: 5;
        }

        .cell {
            position: relative;
            /* border: 1px solid rgba(255, 255, 255, 0.1); لمساعدتك في التصحيح إذا لزم الأمر */
            pointer-events: none;
        }

        /* العلامة المتحركة (رادار التصويب) التي ستظهر فوق الرقم المتوقع */
        .target-marker {
            position: absolute;
            inset: 2px;
            border: 3px solid var(--neon-green);
            background-color: rgba(0, 255, 102, 0.35);
            border-radius: 4px;
            box-shadow: 0 0 15px var(--neon-green), inset 0 0 10px var(--neon-green);
            animation: radarBlink 0.6s infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .target-marker::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
        }

        @keyframes radarBlink {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* --------------------------------------
           عناصر التحكم والإدخال
           -------------------------------------- */
        .controls-section {
            background: #0c0c0c;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #222;
        }

        .input-group label {
            display: block;
            color: #888;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-size: 1.4em;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1);
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-predict {
            background: linear-gradient(45deg, #009944, var(--neon-green));
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
        }

        .btn-link {
            background: #111;
            color: #fff;
            border: 1px solid #444;
            display: block;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 15px;
        }
        .btn-link:hover { background: #222; border-color: #666; }

        /* منطقة عرض النتائج والنسب المئوية */
        .stats-box {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        .stat-item {
            flex: 1;
            background: #050505;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .stat-item .num {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }
        
        .stat-item .prob {
            font-size: 1.1em;
            color: var(--neon-green);
        }

        .high-prob { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0, 255, 102, 0.2); }
        .low-prob { border-color: var(--neon-red); color: var(--neon-red); }
        .low-prob .prob { color: var(--neon-red); }

        /* --------------------------------------
           شريط الاتصال الوهمي (Fake API Terminal)
           -------------------------------------- */
        .terminal-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.95);
            border-top: 1px solid var(--neon-green);
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            color: var(--neon-green);
            box-sizing: border-box;
            z-index: 100;
            height: 90px;
            overflow-y: hidden;
            box-shadow: 0 -5px 20px rgba(0, 255, 102, 0.1);
        }

        .terminal-line {
            margin: 3px 0;
            opacity: 0;
            animation: fadeIn 0.2s forwards;
            line-height: 1.4;
        }

        .sys-err { color: var(--neon-red); }
        .sys-warn { color: #ffeb3b; }
        .sys-info { color: #00bcd4; }

        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <div class="main-container">
        <h2>نظام التحليل الخوارزمي المتقدم</h2>
        
        <!-- منطقة الصورة والشبكة التفاعلية -->
        <div class="board-wrapper">
            <!-- استخدمنا الصورة الأساسية التي أرفقتها -->
            <img src="ses.jpg" alt="Roulette Board">
            
            <!-- الشبكة التي ستتطابق مع الأرقام لرسم العلامة المائية -->
            <div class="grid-overlay" id="gridOverlay">
                <!-- سيتم حقن خلايا الأرقام هنا بواسطة الجافاسكربت -->
            </div>
        </div>

        <div class="controls-section">
            <div class="input-group">
                <label>أدخل آخر رقم فائز على الطاولة:</label>
                <input type="number" id="numInput" min="0" max="36" placeholder="مثال: 0">
            </div>

            <button class="btn btn-predict" onclick="runAnalysis()">بدء الفحص الخوارزمي</button>
            
            <a href="https://m.dubibet365.com/" target="_blank" class="btn btn-link">انتقل لروليت دوبيب وشوف</a>

            <div class="stats-box" id="statsBox" style="display: none;">
                <div class="stat-item high-prob">
                    <div class="num" id="res1-num">--</div>
                    <div class="prob">نسبة عالية: <span id="res1-prob">--%</span></div>
                </div>
                <div class="stat-item low-prob">
                    <div class="num" id="res2-num">--</div>
                    <div class="prob">نسبة متوسطة: <span id="res2-prob">--%</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة الاتصال بالسيرفر الوهمية -->
    <div class="terminal-container" id="terminal"></div>

    <script>
        // --- 1. بناء شبكة الأرقام لتتطابق مع الصورة ---
        const gridOverlay = document.getElementById('gridOverlay');
        const cells = {}; // لحفظ مرجع لكل رقم للوصول إليه سريعاً

        function initGrid() {
            // توليد الـ 37 خلية وتحديد موقعها في الـ CSS Grid
            for (let i = 0; i <= 36; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                
                if (i === 0) {
                    // الصفر يأخذ العمود الأول ويمتد على 3 صفوف
                    cell.style.gridColumn = '1';
                    cell.style.gridRow = '1 / 4';
                } else {
                    // حساب العمود: كل 3 أرقام في عمود (1,2,3 في عمود 2 وهكذا)
                    let col = Math.ceil(i / 3) + 1;
                    // حساب الصف بناءً على تخطيط الروليت (الصف العلوي: 3, 6, 9... الأوسط: 2, 5... السفلي: 1, 4...)
                    let row = (i % 3 === 0) ? 1 : (i % 3 === 2) ? 2 : 3;
                    
                    cell.style.gridColumn = col;
                    cell.style.gridRow = row;
                }
                
                gridOverlay.appendChild(cell);
                cells[i] = cell; // حفظ الخلية في الكائن حسب الرقم
            }
        }
        initGrid();

        // --- 2. خوارزمية التخمين والنسب ---
        // ترتيب عجلة الروليت الأوروبية الحقيقية (لعمليات التخمين بالمسافات)
        const wheelSequence = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];

        function runAnalysis() {
            const inputVal = parseInt(document.getElementById('numInput').value);
            if (isNaN(inputVal) || inputVal < 0 || inputVal > 36) {
                alert("الرجاء إدخال رقم صحيح من 0 إلى 36");
                return;
            }

            // إرسال السجل للطرفية الوهمية
            logTerminal(`[tx] Injecting pattern analysis for [${inputVal}] into dubibet365.api...`, 'sys-warn');

            // تنظيف العلامات السابقة من الصورة
            document.querySelectorAll('.target-marker').forEach(el => el.remove());

            // إظهار النتائج بعد หน่วงเวลา للواقعية
            setTimeout(() => {
                const currentIndex = wheelSequence.indexOf(inputVal);
                
                // تحديد رقمين بناءً على مسافات العجلة (خوارزمية القطاعات)
                // نأخذ رقم يبعد +5 ورقم يبعد -4 كمثال للخوارزمية
                let index1 = (currentIndex + 5) % 37;
                let index2 = (currentIndex - 4 + 37) % 37; // +37 لتجنب الأرقام السالبة

                let num1 = wheelSequence[index1];
                let num2 = wheelSequence[index2];

                // توليد نسب مئوية ذكية (النسبة الأعلى لا تتعدى 78%)
                // النسبة العالية: بين 65% و 78%
                let prob1 = Math.floor(Math.random() * (78 - 65 + 1)) + 65; 
                // النسبة الأقل: بين 45% و النسبة العالية - 5%
                let prob2 = Math.floor(Math.random() * ((prob1 - 5) - 45 + 1)) + 45; 

                // عرض النتائج في المربعات
                document.getElementById('statsBox').style.display = 'flex';
                
                document.getElementById('res1-num').innerText = num1;
                document.getElementById('res1-prob').innerText = prob1 + '%';
                
                document.getElementById('res2-num').innerText = num2;
                document.getElementById('res2-prob').innerText = prob2 + '%';

                // رسم العلامة المائية/برمجية (Target Marker) فوق الأرقام في الصورة
                drawMarker(num1);
                drawMarker(num2);

                logTerminal(`[rx] Dubibet AI engine confirmed targets: ${num1} (${prob1}%), ${num2} (${prob2}%)`, 'sys-info');

            }, 800);
        }

        // دالة رسم مربع التصويب فوق الصورة
        function drawMarker(number) {
            const targetCell = cells[number];
            if (targetCell) {
                const marker = document.createElement('div');
                marker.className = 'target-marker';
                targetCell.appendChild(marker);
            }
        }

        // --- 3. محرك الطرفية الوهمية (Terminal Engine) ---
        const terminal = document.getElementById('terminal');
        const bootSequence = [
            { text: "[sys] Booting FawakihAI core components...", delay: 300 },
            { text: "[network] Connecting to wss://m.dubibet365.com/.api", delay: 1000 },
            { text: "[auth] Bypassing security layers...", delay: 1800, class: "sys-warn" },
            { text: "[+] Socket Established! Listening to live spin data.", delay: 3000, class: "sys-info" }
        ];

        function logTerminal(msg, className = '') {
            const line = document.createElement('div');
            line.className = 'terminal-line ' + className;
            // إضافة طابع زمني
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });
            line.innerText = `[${time}] > ${msg}`;
            terminal.appendChild(line);
            
            // إبقاء آخر 4 أسطر فقط لعدم امتلاء الشاشة
            if(terminal.children.length > 4) terminal.removeChild(terminal.firstChild);
        }

        window.onload = () => {
            // تشغيل تسلسل الإقلاع
            bootSequence.forEach(step => {
                setTimeout(() => logTerminal(step.text, step.class), step.delay);
            });

            // إضافة Ping دوري لتبدو الأداة حية
            setTimeout(() => {
                setInterval(() => {
                    logTerminal(`[ping] Latency to dubibet.api: ${Math.floor(Math.random() * 30 + 10)}ms`);
                }, 5000);
            }, 4000);
        };
    </script>
</body>
</html>
